  padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.sim-banner{background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:.85rem;line-height:1.4}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
/* ============ utils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, s = localStorage){ try { return s.getItem(k); } catch(e){ return null; } }, set(k, v, s = localStorage){ try { s.setItem(k, v); } catch(e){} }, del(k, s = localStorage){ try { s.removeItem(k); } catch(e){} } };
const SS = (() => { try { return sessionStorage; } catch(e){ return null; } })();
const sget = k => SS ? store.get(k, SS) : null, sset = (k, v) => SS && store.set(k, v, SS), sdel = k => SS && store.del(k, SS);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
function toast(msg, ms = 2400){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

/* ============ content ============ */
const AVATARS = ["🦊","🐸","🐼","🦄","🐙","🐯","🐵","🐧","🦁","🐨","🐷","🐲","🦖","🐝"];
const AV_COLORS = ["#E5336B","#5BB8FF","#FFD84A","#13B3A2","#B38CFF","#FF9248","#7EE0FF","#FFA3C7"];
const BOT_NAMES = ["נועה","איתי","שירה","עומר","מאיה","יונתן","תמר","רועי"];
const TOPICS = [
  "ארוחת שישי אצל ההורים","קבוצת הוואטסאפ של הגן","טיסה לחו\"ל","המזגן בעבודה","סופר ביום שישי בצהריים","דייטים","השכנים",
  "פקקים באיילון","חדר כושר","הבוס","מילואים","מנגל ביום העצמאות","חתונות","רכבת ישראל","דיאטה","משלוחים מעלי אקספרס",
  "החבר שתמיד מאחר","שוק הדירות","ים בתל אביב בשבת","טינדר","יום הולדת של ילדים","קופת חולים","לימודים באוניברסיטה",
  "הטלפון שלי","אמא שלי","חופש גדול","מסעדות בתל אביב","כביש 6","נטפליקס","קניון בחול המועד","קבוצת הוואטסאפ של המשפחה"
];
const BOT_LINES = [
  "למה כל פעם שאני מגיע מישהו כבר התחיל בלעדיי?","מי החליט שזה בסדר לשלוח הודעה קולית של 4 דקות?","למה זה תמיד עולה פי שתיים ממה שאמרו?",
  "למה תמיד יש אחד שעונה 'אמן' על הכל?","אני מבקש רק שבוע אחד בלי הפתעות","למה המזגן תמיד על 16 ואני תמיד עם סוודר?",
  "חייבים לדבר על זה שכולם עושים פרצוף שזה בסדר","למה התור הכי איטי הוא תמיד התור שלי?","מי מגיע ב-8 כשאמרו 8?? אף אחד",
  "למה אחרי 5 דקות כבר מתחילים לשאול 'נו, מה עוד?'","זה בדיוק כמו בפעם הקודמת רק יותר יקר","הכל טוב עד שמישהו אומר 'רק שאלה קטנה'"
];
const EXAMPLES = ["למה המזגן בעבודה תמיד על 16?","למה תמיד יש מישהו שעונה 'אמן' על הכל?","מי צריך 400 הודעות על איזה צבע בלונים?"];
const RATE = ["😐","🙂","😄","🤣","💀"];

/* ============ backends ============ */
const FB_CONFIGURED = !!(firebaseConfig && firebaseConfig.databaseURL);
const IN_HUB = /\/(odds|sababa)\/?$/.test(location.pathname);
const FORCE_SIM = /[?&]sim\b/.test(location.search);
const KEY = c => "SB_" + c;
function LocalBackend(){
  const mem = {}, subs = {};
  const K = c => "sababa-sim:" + c;
  const read = key => { if (key in mem) return clone(mem[key]); const raw = store.get(key); if (raw == null) return null; try { mem[key] = JSON.parse(raw); return clone(mem[key]); } catch(e){ return null; } };
  const emit = key => { const v = read(key); (subs[key] || []).forEach(cb => cb(clone(v))); };
  const write = (key, val) => { mem[key] = clone(val); if (val == null) store.del(key); else store.set(key, JSON.stringify(val)); emit(key); };
  addEventListener("storage", e => { if (!e.key || !subs[e.key]) return; try { mem[e.key] = e.newValue == null ? null : JSON.parse(e.newValue); } catch(err){} emit(e.key); });
  return {
    kind: "sim", now: () => Date.now(),
    exists: async c => !!read(K(c)),
    create: async (c, d) => write(K(c), d),
    watch(c, cb){ const k = K(c); (subs[k] ||= []).push(cb); setTimeout(() => cb(read(k)), 0); return () => { subs[k] = subs[k].filter(f => f !== cb); }; },
    tx: async (c, fn) => { const cur = read(K(c)); if (!cur) return false; if (fn(cur) === false) return false; write(K(c), cur); return true; },
    presence(){},
  };
}
function FirebaseBackend(){
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database(); let offset = 0;
  db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
  const ref = c => db.ref("rooms/" + KEY(c));
  return {
    kind: "firebase", now: () => Date.now() + offset,
    exists: async c => (await db.ref("rooms/" + KEY(c) + "/createdAt").get()).exists(),
    create: (c, d) => ref(c).set(d),
    watch(c, cb){ const r = ref(c), h = s => cb(s.val()); r.on("value", h); return () => r.off("value", h); },
    async tx(c, fn){ const res = await ref(c).transaction(cur => { if (cur === null) return null; return fn(cur) === false ? undefined : cur; }); return res.committed && res.snapshot.exists(); },
    presence(c, pid){ const on = db.ref("rooms/" + KEY(c) + "/players/" + pid + "/online"); db.ref(".info/connected").on("value", s => { if (s.val()){ on.onDisconnect().set(false); on.set(true); } }); },
  };
}

/* ============ state ============ */
let B = null, code = null, room = null, unwatch = null, loaded = false;
const me = { pid: sget("sb-pid") || uid(), name: store.get("sb-name") || store.get("odds-name") || "" };
sset("sb-pid", me.pid);
const ui = { text: "", rates: {}, phaseKey: "", busy: false, topicDraft: "" };

/* ============ helpers ============ */
const playersOf = r => Object.entries(r?.players || {}).map(([id, p]) => ({ id, ...p })).sort((a, b) => a.joinedAt - b.joinedAt);
const onlinePlayers = r => playersOf(r).filter(p => p.online !== false);
const hostOf = r => onlinePlayers(r).filter(p => !p.isBot)[0]?.id || r?.hostPid;
const isHost = () => room && hostOf(room) === me.pid;
const P = (r, id) => (r?.players || {})[id];
const nameOf = (r, id) => P(r, id)?.name || "?";
function av(r, id){ const p = P(r, id) || { avatar: 0 }; return `<div class="av" style="background:${AV_COLORS[p.avatar % AV_COLORS.length]}">${AVATARS[p.avatar % AVATARS.length]}</div>`; }
const dots = `<span class="dots"><span></span><span></span><span></span></span>`;
const roundsOf = r => r.settings?.rounds || 5;
/* who still owes a rating: online players who have at least one answer by someone else to rate */
const rateTargets = (r, pid) => (r.order || []).filter(a => a !== pid && (r.answers || {})[a]);
const ratersPending = r => onlinePlayers(r).filter(p => rateTargets(r, p.id).length && !(r.ratings || {})[p.id]).map(p => p.id);
const writersPending = r => onlinePlayers(r).filter(p => !(r.answers || {})[p.id]).map(p => p.id);

/* ============ mutations (inside tx) ============ */
function newRound(r, now){
  r.round = (r.round || 0) + 1;
  r.answers = null; r.ratings = null; r.order = null; r.results = null;
  if (r.round > roundsOf(r)){ r.phase = "final"; return; }
  const used = new Set(r.usedTopics || []);
  const pool = TOPICS.filter(t => !used.has(t));
  r.topic = pick(pool.length ? pool : TOPICS);
  r.usedTopics = [...used, r.topic].slice(-25);
  r.phase = "writing";
  r.deadline = r.settings?.timer ? now + r.settings.timer * 1000 : null;
}
function closeWriting(r){
  const ids = Object.keys(r.answers || {});
  if (!ids.length){ r.phase = "results"; r.results = []; return; }
  r.order = shuffle(ids); r.ratings = null; r.phase = "rating";
  if (!ratersPending(r).length) closeRating(r);
}
function closeRating(r){
  const ratings = r.ratings || {};
  r.results = (r.order || []).map(a => {
    const vals = Object.entries(ratings).filter(([rater]) => rater !== a).map(([, m]) => m?.[a]).filter(v => v > 0);
    const pts = vals.reduce((s, v) => s + v, 0);
    return { pid: a, name: nameOf(r, a), text: r.answers[a], pts, avg: vals.length ? Math.round(pts / vals.length * 10) / 10 : 0, n: vals.length };
  }).sort((x, y) => y.pts - x.pts || y.avg - x.avg);
  r.results.forEach(x => { if (r.players[x.pid]) r.players[x.pid].score = (r.players[x.pid].score || 0) + x.pts; });
  const best = r.results[0];
  if (best && best.pts > 0){ r.hall = [...(r.hall || []), { ...best, topic: r.topic }].sort((x, y) => y.avg - x.avg || y.pts - x.pts).slice(0, 3); }
  r.phase = "results";
}
const A = {
  start: now => r => { if (!["lobby", "final"].includes(r.phase)) return false; Object.values(r.players || {}).forEach(p => p.score = 0); r.hall = null; r.round = 0; newRound(r, now); },
  newTopic: (t, now) => r => { if (r.phase !== "writing" || Object.keys(r.answers || {}).length) return false; r.topic = t || pick(TOPICS.filter(x => x !== r.topic)); if (r.settings?.timer) r.deadline = now + r.settings.timer * 1000; },
  answer: (pid, text) => r => { if (r.phase !== "writing") return false; r.answers = r.answers || {}; r.answers[pid] = text; if (!writersPending(r).length) closeWriting(r); },
  closeWriting: r => { if (r.phase !== "writing") return false; closeWriting(r); },
  rate: (pid, map) => r => { if (r.phase !== "rating") return false; r.ratings = r.ratings || {}; r.ratings[pid] = map; if (!ratersPending(r).length) closeRating(r); },
  closeRating: r => { if (r.phase !== "rating") return false; closeRating(r); },
  next: now => r => { if (r.phase !== "results") return false; newRound(r, now); },
  toLobby: r => { r.phase = "lobby"; r.round = 0; r.answers = r.ratings = r.order = r.results = null; },
};
async function act(fn){ if (!B || !code) return false; try { return await B.tx(code, fn); } catch(e){ console.error(e); toast("שגיאת חיבור, נסה שוב"); return false; } }

/* ============ room lifecycle ============ */
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function askName(){ const v = ($("#nameInput")?.value || me.name || "").trim().slice(0, 14); if (!v){ toast("איך קוראים לך? 🙂"); $("#nameInput")?.focus(); return false; } me.name = v; store.set("sb-name", v); store.set("odds-name", v); return true; }
async function createRoom(){
  if (!askName()) return; ui.busy = true; render();
  let c; for (let i = 0; i < 10; i++){ c = Array.from({ length: 4 }, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join(""); if (!(await B.exists(c))) break; }
  const now = B.now();
  await B.create(c, { game: "sababa", createdAt: now, hostPid: me.pid, phase: "lobby", round: 0, settings: { rounds: 5, timer: 90 },
    players: { [me.pid]: { name: me.name, score: 0, joinedAt: now, online: true, avatar: rnd(AVATARS.length) } } });
  ui.busy = false; enterRoom(c);
}
async function joinRoom(c){
  if (!askName()) return;
  c = (c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (c.length !== 4) return toast("קוד חדר צריך להיות 4 תווים");
  ui.busy = true; render();
  if (!(await B.exists(c))){ ui.busy = false; render(); return toast(B.kind === "sim" ? "החדר לא נמצא (בסימולציה – רק באותו דפדפן)" : "החדר לא נמצא, בדוק את הקוד"); }
  const now = B.now();
  const ok = await B.tx(c, r => {
    r.players = r.players || {};
    if (r.players[me.pid]){ r.players[me.pid].name = me.name; r.players[me.pid].online = true; return; }
    if (Object.keys(r.players).length >= 14) return false;
    const used = new Set(Object.values(r.players).map(p => p.avatar)); let a = rnd(AVATARS.length);
    for (let i = 0; i < AVATARS.length && used.has(a); i++) a = (a + 1) % AVATARS.length;
    r.players[me.pid] = { name: me.name, score: 0, joinedAt: now, online: true, avatar: a };
  });
  ui.busy = false; if (!ok){ render(); return toast("החדר מלא"); }
  enterRoom(c);
}
function enterRoom(c){
  code = c; loaded = false; room = null; sset("sb-room", c);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + c); } catch(e){}
  unwatch?.(); unwatch = B.watch(c, v => { loaded = true; room = v; onRoom(); });
  B.presence(c, me.pid); render();
}
async function leaveRoom(){
  if (code) await act(r => { if (!r.players?.[me.pid]) return false; if (r.phase === "lobby") delete r.players[me.pid]; else r.players[me.pid].online = false; });
  unwatch?.(); unwatch = null; code = null; room = null; sdel("sb-room");
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  stopConfetti(); render();
}
function onRoom(){
  if (room && !room.players?.[me.pid]){ toast("יצאת מהחדר"); leaveRoom(); return; }
  if (room){
    const k = room.phase + ":" + room.round;
    if (k !== ui.phaseKey){ ui.phaseKey = k; if (room.phase === "writing") ui.text = ""; ui.rates = {}; window.scrollTo({ top: 0, behavior: "smooth" }); if (room.phase !== "final") stopConfetti(); }
    if (room.phase === "final") startConfetti();
  }
  render(); driveBots();
}

/* ============ bots (sim helpers, driven by host) ============ */
const botTimers = new Set();
function botLater(key, ms, fn){ if (botTimers.has(key)) return; botTimers.add(key); setTimeout(fn, ms); }
function driveBots(){
  const r = room; if (!r || !isHost()) return;
  const bots = onlinePlayers(r).filter(p => p.isBot).map(p => p.id); if (!bots.length) return;
  const k = r.phase + ":" + r.round;
  if (r.phase === "writing") bots.filter(id => !(r.answers || {})[id]).forEach(id => botLater(k + id, 2500 + rnd(5000), () => act(A.answer(id, pick(BOT_LINES)))));
  if (r.phase === "rating") bots.filter(id => !(r.ratings || {})[id]).forEach(id => botLater(k + id, 1500 + rnd(3500), () => {
    const m = {}; rateTargets(room, id).forEach(a => m[a] = 1 + rnd(5)); act(A.rate(id, m)); }));
}
async function addBot(){
  const now = B.now();
  await act(r => {
    const ps = Object.values(r.players || {}); if (ps.length >= 14) return false;
    const names = new Set(ps.map(p => p.name)); const used = new Set(ps.map(p => p.avatar)); let a = rnd(AVATARS.length);
    for (let i = 0; i < AVATARS.length && used.has(a); i++) a = (a + 1) % AVATARS.length;
    r.players["bot_" + uid()] = { name: BOT_NAMES.find(n => !names.has(n)) || "בוט", score: 0, joinedAt: now, online: true, avatar: a, isBot: true };
  });
}

/* ============ ticker ============ */
let closeAsked = "";
setInterval(() => {
  if (!room || !B) return;
  if (room.phase === "writing" && room.deadline){
    const left = Math.max(0, Math.ceil((room.deadline - B.now()) / 1000));
    const el = $("#timer"); if (el){ el.textContent = "⏱ " + left; el.classList.toggle("low", left <= 10); }
    const k = room.round + ":" + room.deadline;
    if (left <= 0 && isHost() && closeAsked !== k){ closeAsked = k; act(A.closeWriting); }
  }
  if (room.phase === "rating" && isHost() && !ratersPending(room).length) act(A.closeRating);
}, 250);

/* ============ confetti ============ */
let confRAF = null;
function startConfetti(){
  if (confRAF || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); cv.hidden = false; const ctx = cv.getContext("2d"); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ["#E5336B","#FFD84A","#13B3A2","#5BB8FF","#FFF6E2","#231407"];
  const ps = Array.from({ length: 150 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.1 + Math.random() * .2, c: pick(cols) }));
  const t0 = performance.now();
  const step = t => { ctx.clearRect(0, 0, cv.width, cv.height); const d = devicePixelRatio, live = t - t0 < 7000;
    ps.forEach(p => { p.y += p.vy * d; p.x += p.vx * d; p.r += p.vr; if (p.y > cv.height && live){ p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w * d / 2, -p.h * d / 2, p.w * d, p.h * d); ctx.restore(); });
    if (live || ps.some(p => p.y < cv.height)) confRAF = requestAnimationFrame(step); else stopConfetti(); };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ if (confRAF) cancelAnimationFrame(confRAF); confRAF = null; const cv = $("#confetti"); if (cv) cv.hidden = true; }

    : `<div class="card center"><div class="label">אף אחד לא כתב כלום הסיבוב 🦗</div></div>`}
  <div class="card"><div class="label">טבלת הניקוד</div>${board(r)}</div>
  ${isHost() ? `<button class="btn lemon big block" data-act="next">${last ? "🏆 לתוצאות הסופיות" : "➡️ סיבוב הבא"}</button>` : `<div class="waiting">מחכים לסיבוב הבא ${dots}</div>`}`;
}
function vFinal(r){
  const ps = playersOf(r).sort((a, b) => (b.score || 0) - (a.score || 0)), top = ps[0];
  const tied = ps.filter(p => (p.score || 0) === (top?.score || 0));
  return `${topbar()}
  <div class="card center"><div class="crown">👑</div><div class="eyebrow">${tied.length > 1 ? "מלכי הקיטורים (תיקו!)" : "מלך/מלכת הקיטורים"}</div>
    <div class="row" style="justify-content:center">${tied.map(p => `<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px">${av(r, p.id).replace('class="av"', 'class="av xl"')}<div class="king">${esc(p.name)}</div></div>`).join("")}</div>
    <div class="king">${top?.score || 0} ⭐</div></div>
  ${(r.hall || []).length ? `<div class="label" style="text-align:center">🏅 המשפטים של הערב</div><div class="notes">${r.hall.map(h => `<div class="note"><div class="small muted">${esc(h.topic)} · ממוצע ${h.avg}</div><div class="line"><b>סבבה והכל, אבל</b> ${esc(h.text)}</div><div class="small"><b>${esc(h.name)}</b></div></div>`).join("")}</div>` : ""}
  <div class="card"><div class="label">הדירוג הסופי</div>${board(r)}</div>
  ${isHost() ? `<button class="btn berry big block" data-act="again">🔁 משחק חוזר</button>` : `<div class="waiting">מחכים למנהל החדר…</div>`}`;
}
function view(){
  if (!B) return `<div class="waiting" style="min-height:60vh">טוען ${dots}</div>`;
  if (!code) return vHome();
  if (!loaded) return `<div class="waiting" style="min-height:60vh">מתחבר לחדר ${esc(code)} ${dots}</div>`;
  if (!room) return `<div class="card center"><h2>החדר נסגר 🤷</h2><button class="btn lemon block" data-act="leave">חזרה למסך הראשי</button></div>`;
  return ({ lobby: vLobby, writing: vWriting, rating: vRating, results: vResults, final: vFinal }[room.phase] || vLobby)(room);
}
let lastHTML = "";
function render(){
  const html = view(); if (html === lastHTML) return;
  const a = document.activeElement, fid = a?.id, sel = fid && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  const keep = { nameInput: $("#nameInput")?.value, codeInput: $("#codeInput")?.value };
  const y = scrollY;
  $("#app").innerHTML = html; lastHTML = html;
  const ni = $("#nameInput"); if (ni) ni.value = keep.nameInput ?? me.name;
  const ci = $("#codeInput"); if (ci) ci.value = keep.codeInput ?? (location.hash.match(/^#([A-Za-z0-9]{4})$/)?.[1] || "").toUpperCase();
  const an = $("#answer"); if (an){ an.value = ui.text; const c = $("#counter"); if (c) c.textContent = ui.text.length + "/160"; }
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch(e){} } }
  if (room?.phase === "rating") window.scrollTo(0, y);
}

/* ============ events ============ */
document.addEventListener("input", e => {
  if (e.target.id === "answer"){ ui.text = e.target.value; const c = $("#counter"); if (c) c.textContent = ui.text.length + "/160"; }
  if (e.target.id === "codeInput") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "codeInput") joinRoom(e.target.value); });
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a){
    case "create": return createRoom();
    case "join": return joinRoom($("#codeInput")?.value);
    case "leave": return leaveRoom();
    case "copy": try { await navigator.clipboard.writeText(shareText()); toast("הלינק הועתק 📋"); } catch(err){ toast("קוד: " + code + " · " + shareLink(), 4500); } return;
    case "bot": return addBot();
    case "kick": return act(r => { if (r.players?.[t.dataset.id]) delete r.players[t.dataset.id]; else return false; });
    case "set": return act(r => { r.settings = { ...(r.settings || {}), [t.dataset.k]: +v }; });
    case "start": return act(A.start(B.now()));
    case "newTopic": return act(A.newTopic(null, B.now()));
    case "answer": {
      const text = ($("#answer")?.value ?? ui.text).trim().replace(/^סבבה והכל,?\s*אבל\s*/, "");
      if (text.length < 3) return toast("תכתוב/י משהו 😤");
      return act(A.answer(me.pid, text));
    }
    case "closeWriting": return act(A.closeWriting);
    case "rate": ui.rates[t.dataset.a] = +v; return render();
    case "sendRates": {
      const m = {}; rateTargets(room, me.pid).forEach(x => { if (ui.rates[x]) m[x] = ui.rates[x]; });
      return act(A.rate(me.pid, m));
    }
    case "closeRating": return act(A.closeRating);
    case "next": return act(A.next(B.now()));
    case "again": return act(A.toLobby);
  }
});

/* ============ boot ============ */
(async function boot(){
  render();
  if (FB_CONFIGURED && !FORCE_SIM){
    try { await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"); await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"); B = FirebaseBackend(); }
    catch(e){ console.error(e); toast("לא הצלחתי להתחבר, עובר למצב סימולציה", 4000); B = LocalBackend(); }
  } else B = LocalBackend();
  render();
  const q = new URLSearchParams(location.search);
  if (q.get("join") || q.has("create")){
    const j = q.get("join"); try { history.replaceState(null, "", location.pathname); } catch(e){}
    if (me.name){ if (j) joinRoom(j); else createRoom(); return; }
  }
  const saved = sget("sb-room");
  if (saved && me.name && await B.exists(saved)) enterRoom(saved);
})();
</script>
</body>
</html>
