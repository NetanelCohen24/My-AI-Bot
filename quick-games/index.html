*{box-sizing:border-box}
html,body{height:100%}

function LocalBackend(){
  const mem = {}, subs = {}; const K = c => "quick-sim:" + KEY(c);
  const read = key => { if (key in mem) return clone(mem[key]); const raw = store.get(key); if (raw == null) return null; try { mem[key] = JSON.parse(raw); return clone(mem[key]); } catch(e){ return null; } };
  const emit = key => { const v = read(key); (subs[key] || []).forEach(cb => cb(clone(v))); };
  const write = (key, val) => { mem[key] = clone(val); if (val == null) store.del(key); else store.set(key, JSON.stringify(val)); emit(key); };
  addEventListener("storage", e => { if (!e.key || !subs[e.key]) return; try { mem[e.key] = e.newValue == null ? null : JSON.parse(e.newValue); } catch(err){} emit(e.key); });
  return { kind: "sim", now: () => Date.now(), exists: async c => !!read(K(c)), create: async (c, d) => write(K(c), d),
    watch(c, cb){ const k = K(c); (subs[k] ||= []).push(cb); setTimeout(() => cb(read(k)), 0); return () => { subs[k] = subs[k].filter(f => f !== cb); }; },
    tx: async (c, fn) => { const cur = read(K(c)); if (!cur) return false; if (fn(cur) === false) return false; write(K(c), cur); return true; },
    presence(){ return null; } };
}
/* presence: marks me online/offline without ever creating a nameless "ghost" player */
function fbPresence(db, path){
  const pref = db.ref(path), con = db.ref(".info/connected");
  const h = s => { if (!s.val()) return; pref.child("online").onDisconnect().set(false);
    pref.child("name").get().then(n => { if (n.exists()) pref.child("online").set(true); }).catch(() => {}); };
  con.on("value", h);
  return () => { con.off("value", h); pref.child("online").onDisconnect().cancel(); };
}
function FirebaseBackend(){
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database(); let offset = 0;
  db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
  const ref = c => db.ref("rooms/" + KEY(c));
  return { kind: "firebase", now: () => Date.now() + offset,
    exists: async c => (await db.ref("rooms/" + KEY(c) + "/createdAt").get()).exists(),
    create: (c, d) => ref(c).set(d),
    watch(c, cb){ const r = ref(c), h = s => cb(s.val()); r.on("value", h); return () => r.off("value", h); },
    async tx(c, fn){ const res = await ref(c).transaction(cur => { if (cur === null) return null; return fn(cur) === false ? undefined : cur; }); return res.committed && res.snapshot.exists(); },
    presence: (c, pid) => fbPresence(db, "rooms/" + KEY(c) + "/players/" + pid) };
}

/* ============ mutations (inside tx) ============ */
function makePrompt(r){
  const used = new Set(r.usedPrompts || []);
  const list = MODE === "auction" ? SITUATIONS : LIKELY;
  const pool = list.filter(x => !used.has(x)); const base = pick(pool.length ? pool : list);
  r.usedPrompts = [...used, base].slice(-30);
  const names = onlinePlayers(r).map(p => p.name);
  r.prompt = base.replace("{P}", names.length ? "<<" + pick(names) + ">>" : "חבר מהחדר");
}
function newRound(r){
  r.round = (r.round || 0) + 1; r.answers = null; r.result = null; r.countdownAt = null;
  if (r.round > roundsOf(r)){ r.phase = "final"; return; }
  makePrompt(r); r.phase = "answer";
}
function maybeCountdown(r, now){ if (r.phase === "answer" && Object.keys(r.answers || {}).length && !pending(r).length){ r.phase = "countdown"; r.countdownAt = now + 500; } }
function finishRound(r){
  const ans = r.answers || {};
  if (MODE === "auction"){
    const bids = Object.entries(ans).map(([pid, v]) => ({ pid, v: Number(v) }));
    const priced = bids.filter(b => b.v >= 0);
    const min = priced.length ? Math.min(...priced.map(b => b.v)) : null;
    const cheap = min == null ? [] : priced.filter(b => b.v === min).map(b => b.pid);
    cheap.forEach(id => { if (r.players[id]) r.players[id].score = (r.players[id].score || 0) + 1; });
    r.result = { bids: bids.sort((a, b) => (b.v < 0 ? Infinity : b.v) - (a.v < 0 ? Infinity : a.v)), cheap };
  } else {
    const counts = {}; Object.values(ans).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
    const total = Object.values(counts).reduce((s, n) => s + n, 0);
    const max = Math.max(0, ...Object.values(counts));
    const winners = Object.keys(counts).filter(id => counts[id] === max);
    winners.forEach(id => { if (r.players[id]) r.players[id].score = (r.players[id].score || 0) + 1; });
    r.result = { rows: Object.entries(counts).map(([pid, n]) => ({ pid, n, pct: Math.round(n / total * 100) })).sort((a, b) => b.n - a.n), winners, votes: ans };
  }
  r.phase = "reveal";
}
const A = {
  start: r => { if (!["lobby", "final"].includes(r.phase)) return false; Object.values(r.players || {}).forEach(p => { if (p) p.score = 0; }); r.round = 0; newRound(r); },
  swap: r => { if (r.phase !== "answer") return false; r.answers = null; makePrompt(r); r.swaps = (r.swaps || 0) + 1; },
  answer: (pid, v, now) => r => { if (r.phase !== "answer") return false; r.answers = r.answers || {}; r.answers[pid] = v; maybeCountdown(r, now); },
  close: now => r => { if (r.phase !== "answer" || !Object.keys(r.answers || {}).length) return false; r.phase = "countdown"; r.countdownAt = now + 500; },
  reveal: r => { if (r.phase !== "countdown") return false; finishRound(r); },
  next: r => { if (r.phase !== "reveal") return false; newRound(r); },
  toLobby: r => { r.phase = "lobby"; r.round = 0; r.answers = r.result = null; },
};

  const cols = MODE === "auction" ? ["#F5C542","#FFF8E6","#2FD39B","#FF6B4A"] : ["#FFE45C","#2EC4F1","#FFF4F8","#1B0A14"];

  const t0 = performance.now();
  const step = t => { ctx.clearRect(0, 0, cv.width, cv.height); const d = devicePixelRatio, live = t - t0 < 7000;
    ps.forEach(p => { p.y += p.vy * d; p.x += p.vx * d; p.r += p.vr; if (p.y > cv.height && live){ p.y = -20; p.x = Math.random() * cv.width; }

  confRAF = requestAnimationFrame(step);

  </div>
  <div class="mode-pill ${live ? "live" : ""}"><span class="dot"></span>${live ? "מחובר · מולטיפלייר אמיתי" : "מצב סימולציה"}</div>
  ${live ? "" : `<div class="sim-banner">🧪 <b>מצב סימולציה:</b> צור חדר והוסף בוטים כדי לראות איך המשחק עובד.</div>`}
  <div class="card"><div class="label">איך משחקים?</div><ol class="how">${T.how.map(h => `<li><div>${h}</div></li>`).join("")}</ol></div>`;
}
function topbar(){
  const r = room, inGame = !["lobby", "final"].includes(r.phase);
  return `<div class="topbar">${inGame ? "" : `<div class="logo-sm">${T.plain}</div>`}<div class="spacer"></div>
    <span class="chip code">${esc(code)}</span>
    ${inGame ? `<span class="chip">סיבוב ${Math.min(r.round, roundsOf(r))}/${roundsOf(r)}</span>` : ""}
    ${r.phase !== "lobby" ? `<span class="chip">${MODE === "auction" ? "💸" : "⭐"} ${P(r, me.pid)?.score || 0}</span>` : ""}
    ${PARTY ? `<button class="chip ghost" data-act="mute" aria-label="צלילים">${PARTY.load().muted ? "🔇" : "🔊"}</button>` : ""}<button class="chip ghost" data-act="leave">יציאה</button></div>`;
}
function vLobby(r){
  const host = isHost(), n = onlinePlayers(r).length, rounds = roundsOf(r);
  return `${topbar()}
  <div class="card center"><div class="eyebrow">קוד החדר</div><div class="bigcode">${esc(code)}</div>
    <div class="small muted">החברים נכנסים לאותו לינק ומקלידים את הקוד</div>
    <div class="share-row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(shareText())}" target="_blank" rel="noopener">💬 וואטסאפ</a>
    <button class="btn gold" data-act="copy">🔗 העתק לינק</button></div></div>
  <div class="card"><div class="row" style="align-items:center"><h3>שחקנים בחדר</h3><span class="chip" style="flex:0 0 auto">${n}</span></div>
    <ul class="players">${playersOf(r).map(p => `<li class="player ${p.online === false ? "off" : ""}">${av(r, p.id)}<span class="name">${esc(p.name)}</span>
      ${p.id === me.pid ? `<span class="tag">את/ה</span>` : ""}${p.isBot ? `<span class="tag">בוט</span>` : ""}${p.lvl && !p.isBot ? `<span class="tag">⭐ ${+p.lvl}</span>` : ""}${p.id === hostOf(r) ? "👑" : ""}
      ${host && p.id !== me.pid ? `<button class="x" data-act="kick" data-id="${esc(p.id)}" aria-label="הסר">✕</button>` : ""}</li>`).join("")}</ul>
    ${host ? `<button class="btn small" data-act="bot">🤖 הוסף בוט${B.kind === "sim" ? " לבדיקה" : " (לנסות לבד או להשלים שחקנים)"}</button>` : ""}</div>
  ${host ? `<div class="card"><div class="label">כמה סיבובים?</div>
    <div class="seg">${[3, 5, 8, 10].map(k => `<button data-act="rounds" data-v="${k}" class="${k === rounds ? "on" : ""}">${k}</button>`).join("")}</div>
    <button class="btn hot big block" data-act="start" ${n < MIN_PLAYERS ? "disabled" : ""}>${n < MIN_PLAYERS ? `צריך לפחות ${MIN_PLAYERS} שחקנים` : "🚀 יאללה, מתחילים!"}</button></div>`
    : `<div class="waiting">מחכים ש${esc(nameOf(r, hostOf(r)))} יתחיל/תתחיל ${dots}</div>`}`;
}
function vAnswer(r){
  const mine = (r.answers || {})[me.pid];
  const ids = onlinePlayers(r).map(p => p.id), done = id => (r.answers || {})[id] != null;
  let body;
  if (mine != null){
    body = `<div class="card center"><div class="eyebrow">נעלת</div><div class="locked">${MODE === "auction" ? esc(shekel(mine)) : esc(nameOf(r, mine))} 🔒</div><div class="muted small">מחכים לשאר ${dots}</div></div>`;
  } else if (MODE === "auction"){
    body = `<div class="card"><label class="label" for="amount">הסכום המינימלי שלך (בסוד 🤫)</label>
      <div class="money"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" maxlength="13"><span class="cur">₪</span></div>
      <div class="quick">${[100, 1000, 10000, 50000, 100000, 1000000].map(v => `<button data-act="setAmt" data-v="${v}">${v.toLocaleString("he-IL")}</button>`).join("")}</div>
      <button class="btn gold big block" data-act="bid">🔒 נעל סכום</button>
      <button class="btn small" data-act="never">🚫 לא בשום מחיר</button></div>`;
  } else {
    body = `<div class="card"><div class="label">בחר/י בסוד 🤫</div>
      <div class="pick-grid">${onlinePlayers(r).map(p => `<button data-act="choose" data-id="${esc(p.id)}" class="${ui.choice === p.id ? "on" : ""}">${av(r, p.id, "lg")}<span class="nm">${esc(p.name)}${p.id === me.pid ? " (אני)" : ""}</span></button>`).join("")}</div>
      <button class="btn hot big block" data-act="vote" ${ui.choice ? "" : "disabled"}>🔒 נעל הצבעה${ui.choice ? ": " + esc(nameOf(r, ui.choice)) : ""}</button></div>`;
  }
  const swap = isHost() ? `<button class="btn small dark" data-act="swap">🔄 ${MODE === "auction" ? "החלף סיטואציה" : "החלף משפט"}${Object.keys(r.answers || {}).length ? " (הבחירות יימחקו)" : ""}</button>` : "";
  return `${topbar()}${promptBox(r)}${body}
    <div class="card"><div class="row" style="align-items:center"><div class="label">מי כבר נעל</div><span class="chip" style="flex:0 0 auto">${ids.filter(done).length}/${ids.length}</span></div>${pills(r, ids, done)}</div>
    ${hostTools(swap + (Object.keys(r.answers || {}).length ? `<button class="btn small" data-act="close">⏭ חשוף עכשיו</button>` : ""))}`;
}
function vCountdown(r){
  const left = r.countdownAt + 3000 - B.now();
  return `${topbar()}${promptBox(r)}<div class="countdown tick" id="cd" aria-live="assertive">${Math.max(1, Math.ceil(left / 1000))}</div>
  <div class="waiting">${MODE === "auction" ? "פותחים את המעטפות…" : "סופרים קולות…"}</div>`;
}
function nextBtn(r){ const last = r.round >= roundsOf(r);
  return isHost() ? `<button class="btn gold big block" data-act="next">${last ? "🏆 לתוצאות הסופיות" : "➡️ סיבוב הבא"}</button>` : `<div class="waiting">מחכים לסיבוב הבא ${dots}</div>`; }
function vReveal(r){
  const res = r.result || {};
  if (MODE === "auction"){
    const bids = res.bids || [], cheap = res.cheap || [], step = .7;
    const rows = bids.map((b, i) => `<div class="bid ${b.v < 0 ? "never" : ""} ${cheap.includes(b.pid) ? "cheap" : ""}" style="animation-delay:${i * step}s${cheap.includes(b.pid) ? `, ${i * step + .5}s` : ""}">
      ${av(r, b.pid)}<span class="nm">${esc(nameOf(r, b.pid))}</span><span class="amt">${esc(shekel(b.v))}</span></div>`).join("");
    const delay = bids.length * step + .3;
    const spot = cheap.length ? `<div class="spotlight" style="animation-delay:${delay}s">
        <div class="row" style="justify-content:center;flex:0 0 auto">${cheap.map(id => av(r, id, "xl")).join("")}</div>
        <h2>💸 ${cheap.map(id => esc(nameOf(r, id))).join(" ו")} ${cheap.length > 1 ? "הכי זולים!" : "הכי זול/ה!"}</h2>
        <div>רק ${esc(shekel(bids.find(b => b.pid === cheap[0])?.v))}?! עכשיו תסביר/י לכולם למה 🎤</div></div>`
      : `<div class="spotlight" style="animation-delay:${delay}s"><h2>🚫 אף אחד לא מוכן!</h2><div>כולם אמרו בשום מחיר. סיטואציה קשה.</div></div>`;
    return `${topbar()}${promptBox(r)}<div class="label" style="text-align:center;color:var(--on-stage)">מהיקר לזול 👇</div><div class="bids">${rows}</div>${spot}${nextBtn(r)}`;
  }
  const rows = res.rows || [], winners = res.winners || [];
  const bars = rows.map((x, i) => `<div class="barrow ${winners.includes(x.pid) ? "win" : ""}" style="animation-delay:${i * .25}s">${av(r, x.pid)}
    <div><div class="meta"><span>${esc(nameOf(r, x.pid))}</span><span class="pct">${x.pct}% · ${x.n}</span></div><div class="track"><div class="fill" style="--w:${x.pct}%;animation-delay:${i * .25 + .2}s"></div></div></div></div>`).join("");
  const votes = Object.entries(res.votes || {});
  return `${topbar()}${promptBox(r)}
  <div class="spotlight"><div class="row" style="justify-content:center;flex:0 0 auto">${winners.map(id => av(r, id, "xl")).join("")}</div>
    <h2>🏆 ${winners.map(id => esc(nameOf(r, id))).join(" ו")}!</h2><div>${winners.length > 1 ? "תיקו! כל אחד מקבל נקודה (או שותה) 🍻" : "+1 נקודה (או שותה) 🍻"}</div></div>
  <div class="card"><div class="label">האחוזים</div><div class="bars">${bars}</div>
    <details class="who"><summary>👀 מי הצביע למי?</summary><ul>${votes.map(([v, t]) => `<li>${esc(nameOf(r, v))} ← ${esc(nameOf(r, t))}</li>`).join("")}</ul></details></div>
  ${nextBtn(r)}`;
}
function board(r){
  const ps = playersOf(r).sort((a, b) => (b.score || 0) - (a.score || 0)); let rank = 0, prev = null;
  return `<ol class="board">${ps.map((p, i) => { if ((p.score || 0) !== prev){ rank = i + 1; prev = p.score || 0; }
    return `<li class="${p.id === me.pid ? "me" : ""}"><span class="rk">${["🥇","🥈","🥉"][rank - 1] || rank}</span>${av(r, p.id)}<span class="nm">${esc(p.name)}</span><span class="pt">${p.score || 0}</span></li>`; }).join("")}</ol>`;
}
function vFinal(r){
  const ps = playersOf(r).sort((a, b) => (b.score || 0) - (a.score || 0)), top = ps[0];
  const tied = ps.filter(p => (p.score || 0) === (top?.score || 0));
  const nobody = !top || !(top.score > 0);
  return `${topbar()}
  <div class="card center"><div class="crown">👑</div><div class="eyebrow">${T.kingLabel}${tied.length > 1 ? " (תיקו!)" : ""}</div>
    ${nobody ? `<div class="king">אף אחד 😅</div>` : `<div class="row" style="justify-content:center">${tied.map(p => `<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px">${av(r, p.id, "xl")}<div class="king">${esc(p.name)}</div></div>`).join("")}</div>
    <div class="muted">${top.score} ${T.scoreLabel}</div>`}</div>
  <div class="card"><div class="label">הדירוג הסופי · ${T.scoreLabel}</div>${board(r)}</div>
  ${isHost() ? `<button class="btn hot big block" data-act="again">🔁 משחק חוזר</button>` : `<div class="waiting">מחכים למנהל החדר…</div>`}`;
}
function view(){
  if (!B) return `<div class="waiting" style="min-height:60vh">טוען ${dots}</div>`;
  if (!code) return vHome();
  if (!loaded) return `<div class="waiting" style="min-height:60vh">מתחבר לחדר ${esc(code)} ${dots}</div>`;
  if (!room) return `<div class="card center"><h2>החדר נסגר 🤷</h2><button class="btn gold block" data-act="leave">חזרה למסך הראשי</button></div>`;
  return ({ lobby: vLobby, answer: vAnswer, countdown: vCountdown, reveal: vReveal, final: vFinal }[room.phase] || vLobby)(room);
}
let lastHTML = "";
function render(){
  const html = view(); if (html === lastHTML) return;
  const a = document.activeElement, fid = a?.id, sel = fid && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  const keep = { nameInput: $("#nameInput")?.value, codeInput: $("#codeInput")?.value };
  $("#app").innerHTML = html; lastHTML = html;
  const ni = $("#nameInput"); if (ni) ni.value = keep.nameInput ?? me.name;
  const ci = $("#codeInput"); if (ci) ci.value = keep.codeInput ?? (location.hash.match(/^#([A-Za-z0-9]{4})$/)?.[1] || "").toUpperCase();
  const am = $("#amount"); if (am) am.value = ui.amount;
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch(e){} } }
}
const fmtAmount = s => { const d = String(s).replace(/\D/g, "").slice(0, 10); return d ? Number(d).toLocaleString("he-IL") : ""; };

/* ============ events ============ */
document.addEventListener("input", e => {
  if (e.target.id === "amount"){ ui.amount = fmtAmount(e.target.value); e.target.value = ui.amount; }
  if (e.target.id === "codeInput") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "codeInput") joinRoom(e.target.value); });
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a){
    case "create": return createRoom();
    case "join": return joinRoom($("#codeInput")?.value);
    case "leave": return leaveRoom();
    case "copy": try { await navigator.clipboard.writeText(shareText()); toast("הלינק הועתק 📋"); } catch(err){ toast("קוד: " + code + " · " + shareLink(), 4500); } return;
    case "bot": return addBot();
    case "kick": return act(r => { if (r.players?.[t.dataset.id]) delete r.players[t.dataset.id]; else return false; });
    case "rounds": return act(r => { r.settings = { ...(r.settings || {}), rounds: +v }; });
    case "start": return act(A.start);
    case "swap": return act(A.swap);
    case "setAmt": ui.amount = Number(v).toLocaleString("he-IL"); { const am = $("#amount"); if (am) am.value = ui.amount; } return;
    case "bid": { const n = Number(String($("#amount")?.value || ui.amount).replace(/\D/g, ""));
      if (!String($("#amount")?.value || ui.amount).trim()) return toast("כתוב/י סכום (או 🚫 בשום מחיר)");
      return act(A.answer(me.pid, n, B.now())); }
    case "never": return act(A.answer(me.pid, -1, B.now()));
    case "choose": ui.choice = t.dataset.id; return render();
    case "vote": if (!ui.choice) return; return act(A.answer(me.pid, ui.choice, B.now()));
    case "close": return act(A.close(B.now()));
    case "next": return act(A.next);
    case "again": return act(A.toLobby);
  }
});

/* ============ boot ============ */
(async function boot(){
  document.title = T.plain;
  render();
  if (FB_CONFIGURED && !FORCE_SIM){
    try { await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"); await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"); B = FirebaseBackend(); }
    catch(e){ console.error(e); toast("לא הצלחתי להתחבר, עובר למצב סימולציה", 4000); B = LocalBackend(); }
  } else B = LocalBackend();
  render();
  const q = new URLSearchParams(location.search);
  if (q.get("join") || q.has("create")){
    const j = q.get("join"); try { history.replaceState(null, "", location.pathname); } catch(e){}
    if (me.name){ if (j) joinRoom(j); else createRoom(); return; }
  }
  const saved = sget(ROOM_KEY);
  if (saved && me.name && await B.exists(saved)) joinRoom(saved);
})();
</script>
</body>
</html>
